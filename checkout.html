<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .checkout-form {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .checkout-btn {
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Checkout</h1>
    
    <div class="checkout-form">
        <h2>Payment Details</h2>
        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" required>
        <label for="expiryDate">Expiry Date:</label>
        <input type="text" id="expiryDate" placeholder="MM/YYYY" required>
        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" required>

        <h2>Billing Address</h2>
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" required>
        <label for="address">Address:</label>
        <input type="text" id="address" required>
        <label for="city">City:</label>
        <input type="text" id="city" required>
        <label for="state">State:</label>
        <input type="text" id="state" required>
        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" required>

        <h2>Contact Details</h2>
        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" required>
		<a href="splash.html?target=feedback.html">
        <button class="checkout-btn" onclick="checkout()">Place Order</button>
		</a>
    </div>
</div>

<script>
    function checkout() {
        // Fetch payment details
        let cardNumber = document.getElementById('cardNumber').value;
        let expiryDate = document.getElementById('expiryDate').value;
        let cvv = document.getElementById('cvv').value;

        // Fetch billing address
        let fullName = document.getElementById('fullName').value;
        let address = document.getElementById('address').value;
        let city = document.getElementById('city').value;
        let state = document.getElementById('state').value;
        let zip = document.getElementById('zip').value;

        // Fetch contact details
        let email = document.getElementById('email').value;
        let phone = document.getElementById('phone').value;

        // Perform checkout operation (dummy action)
        let orderDetails = {
            payment: {
                cardNumber: cardNumber,
                expiryDate: expiryDate,
                cvv: cvv
            },
            billingAddress: {
                fullName: fullName,
                address: address,
                city: city,
                state: state,
                zip: zip
            },
            contactDetails: {
                email: email,
                phone: phone
            }
        };

        console.log(orderDetails); // Send this data to your backend for processing
        alert('Order placed successfully!'); // Dummy success message
    }
	
	
	let cart = [];

    function addToCart(button) {
        let productItem = button.parentElement;
        let id = productItem.dataset.id;
        let name = productItem.dataset.name;
        let price = parseFloat(productItem.dataset.price);
        let quantity = parseInt(productItem.querySelector('input[type="number"]').value);

        let existingItem = cart.find(item => item.id === id);
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({
                id: id,
                name: name,
                price: price,
                quantity: quantity
            });
        }
        updateOrderSummary();
		
		 let cartUrl = `cart.html?name=${encodeURIComponent(name)}&price=${price}&quantity=${quantity}}`;
    }

    function updateOrderSummary() {
        let orderList = document.getElementById('orderList');
        let totalPrice = 0;
        
        // Clear existing order list
        orderList.innerHTML = '';
        
        // Populate order list with cart items
        cart.forEach(item => {
            let listItem = document.createElement('li');
            listItem.textContent = `${item.name} - Quantity: ${item.quantity} - Price: $${(item.price * item.quantity).toFixed(2)}`;
            orderList.appendChild(listItem);
            totalPrice += item.price * item.quantity;
        });
        
        // Display total price
        let totalPriceElement = document.createElement('li');
        totalPriceElement.textContent = `Total Price: $${totalPrice.toFixed(2)}`;
        orderList.appendChild(totalPriceElement);
    }
	
	
	
</script>
</body>
</html>
